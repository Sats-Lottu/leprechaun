[project]
name = "hub"
version = "0.1.0"
description = ""
authors = [
    {name = "Lucas Santos Silva",email = "luss1010@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "nicegui (>=3.6.1,<4.0.0)",
    "faststream[rabbit] (>=0.6.5,<0.7.0)",
    "fastapi[standard] (>=0.128.1,<0.129.0)",
    "pydantic-settings (>=2.12.0,<3.0.0)",
    "authlib (>=1.6.8,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "psycopg[binary] (>=3.3.3,<4.0.0)",
    "segno (>=1.6.6,<2.0.0)"
]

[dependency-groups]
dev = [
    "taskipy (>=1.14.1,<2.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "testcontainers (>=4.14.2,<5.0.0)",
    "freezegun (>=1.5.5,<2.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "ruff (>=0.15.11,<0.16.0)",
    "typos (>=1.45.1,<2.0.0)",
    "pytest-playwright-asyncio (>=0.7.2,<0.8.0)"
]

[tool.ruff]
line-length = 79
extend-exclude = ['migrations']

[tool.ruff.lint]
preview = true
select = ['I', 'F', 'E', 'W', 'PL', 'PT', 'FAST']

[tool.ruff.format]
preview = true
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = "."
addopts = '-p nicegui.testing.user_plugin'
asyncio_mode = 'auto'
asyncio_default_fixture_loop_scope = 'function'
main_file = 'hub/main.py'
markers = [
    'e2e: end-to-end browser tests',
]
filterwarnings = [
    'ignore::authlib.deprecate.AuthlibDeprecationWarning',
]

[tool.coverage.run]
core = "ctrace"
concurrency = ["thread", "greenlet"]

[tool.taskipy.tasks]
pre_lint = 'typos'
lint = 'ruff check'
pre_format = 'ruff check --fix'
format = 'ruff format'
pre_test = 'task lint'
run = 'fastapi dev hub/main.py'
test = 'pytest -s -x --cov=hub -vv'
test_e2e = 'pytest -s -x -m e2e tests/e2e -vv'
playwright_install = 'playwright install chromium'
post_test = 'coverage html'

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.typos.default]
extend-ignore-identifiers-re = ["selectin"]

[tool.typos.files]
extend-exclude = ["*.md"]
