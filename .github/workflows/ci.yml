name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  services:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [hub, ledger, pls]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install poetry==2.4.3
      - run: poetry install --no-interaction
      - run: poetry run python -m ruff check .
      - run: poetry run python -m pytest -q
