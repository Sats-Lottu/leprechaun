# WARNING: NEVER USE THIS BOOTSTRAP IN PRODUCTION.
# Public credentials, fictitious identities and simulated balances only.
# Development only: isolated volumes, known credentials and simulated funds.
name: leprechaun-local
services:
  database:
    volumes:
      - local_pgdata:/var/lib/postgresql/data

  satoidc:
    build:
      context: ${SATOIDC_SOURCE_DIR:-../satoidc}
      dockerfile: satoidc/DockerFile
    entrypoint: [poetry, run, python, /bootstrap/start-satoidc.py]
    environment:
      PYTHONPATH: /app
      APP_ENV: development
      # Isolated HTTP development network only; production must use HTTPS.
      AUTHLIB_INSECURE_TRANSPORT: '1'
      DOMAIN: localhost
      DATABASE_URL: sqlite+aiosqlite:////home/appuser/satoidc.db
      SYNC_DATABASE_URL: sqlite:////home/appuser/satoidc.db
      OAUTH2_JWT_ISS: http://localhost:8080
      OAUTH2_JWT_SECRET_KEY: local-satoidc-signing-secret-development-only
      SESSION_MIDDLEWARE_SECRET_KEY: local-satoidc-session-secret-development-only
      SESSION_COOKIE_HTTPS_ONLY: 'false'
      EMAIL_SENDER_MODE: disabled
      SATOIDC_ADMIN_USERNAME: localadmin
      SATOIDC_ADMIN_EMAIL: admin@example.com
      SATOIDC_ADMIN_PASSWORD: Local-admin-123!
    ports:
      - '127.0.0.1:8080:8000'
    volumes:
      - local_satoidcdata:/home/appuser
      - ./local-bootstrap/start-satoidc-local.py:/bootstrap/start-satoidc.py:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/.well-known/openid-configuration', timeout=2)"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10

  lnbits:
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - local_lnbitsdata:/data

  lnbits-init:
    image: python:3.11-alpine
    command: [python, /bootstrap/lnbits.py]
    volumes:
      - ./local-bootstrap/bootstrap-lnbits.py:/bootstrap/lnbits.py:ro
      - local_config:/local
    depends_on:
      lnbits:
        condition: service_healthy

  ledger:
    environment:
      PYTHONPATH: /app
      PAYMENT_EVENT_CONSUMER_ENABLED: 'true'
    ports:
      - '127.0.0.1:8001:8000'
    entrypoint: [sh, -ec, 'poetry run alembic upgrade head; poetry run python /bootstrap/seed-ledger.py; exec sh /app/entrypoint.sh']
    volumes:
      - ./local-bootstrap/bootstrap-ledger.py:/bootstrap/seed-ledger.py:ro

  pls:
    entrypoint: [python, /bootstrap/start-pls.py]
    volumes:
      - ./local-bootstrap/start-pls-local.py:/bootstrap/start-pls.py:ro
      - local_config:/local:ro
    environment:
      LNBITS_USERNAME: localadmin
      LNBITS_PASSWORD: local-lnbits-password
      LNBITS_WALLET_ID: ''
    depends_on:
      lnbits-init:
        condition: service_completed_successfully

  hub:
    environment:
      OIDC_SERVER_METADATA_URL: http://satoidc:8000/.well-known/openid-configuration
      OIDC_ISSUER: http://localhost:8080
      OIDC_INTERNAL_BASE_URL: http://satoidc:8000
      OIDC_CLIENT_ID: leprechaun-hub
      OIDC_CLIENT_SECRET: ''
    depends_on:
      satoidc:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  local_pgdata:
  local_lnbitsdata:
  local_config:
  local_satoidcdata:
