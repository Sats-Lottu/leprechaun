# WARNING: NEVER USE THIS BOOTSTRAP IN PRODUCTION.
# Public credentials, fictitious identities and simulated balances only.
# Development only: isolated volumes, known credentials and simulated funds.
name: leprechaun-local
services:
  database:
    volumes:
      - local_pgdata:/var/lib/postgresql/data

  keycloak:
    build:
      context: ./local-bootstrap
      dockerfile: keycloak.Dockerfile
      additional_contexts:
        theme: ${KEYCLOAK_THEME_DIR:-../keycloak-sats-lottu-theme}
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: localadmin
      KC_BOOTSTRAP_ADMIN_PASSWORD: Local-admin-123!
      HUB_PORT: ${HUB_PORT:-8000}
      OIDC_REDIRECT_PATH: ${OIDC_REDIRECT_PATH:-/auth/callback}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:-8080}:8080'
    volumes:
      - local_keycloakdata:/opt/keycloak/data
      - ./local-bootstrap/leprechaun-realm.json:/opt/keycloak/data/import/leprechaun-realm.json:ro
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8080
          printf 'GET /realms/leprechaun/.well-known/openid-configuration HTTP/1.1\r\nHost: localhost:8080\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 30

  lnbits:
    ports:
      - '127.0.0.1:5000:5000'
    volumes:
      - local_lnbitsdata:/data

  lnbits-init:
    image: python:3.11-alpine
    command: [python, /bootstrap/lnbits.py]
    volumes:
      - ./local-bootstrap/bootstrap-lnbits.py:/bootstrap/lnbits.py:ro
      - local_config:/local
    depends_on:
      lnbits:
        condition: service_healthy

  ledger:
    environment:
      PYTHONPATH: /app
      PAYMENT_EVENT_CONSUMER_ENABLED: 'true'
    ports:
      - '127.0.0.1:${LEDGER_PORT:-8001}:8000'
    entrypoint: [sh, -ec, 'poetry run alembic upgrade head; poetry run python /bootstrap/seed-ledger.py; exec sh /app/entrypoint.sh']
    volumes:
      - ./local-bootstrap/bootstrap-ledger.py:/bootstrap/seed-ledger.py:ro

  pls:
    entrypoint: [python, /bootstrap/start-pls.py]
    volumes:
      - ./local-bootstrap/start-pls-local.py:/bootstrap/start-pls.py:ro
      - local_config:/local:ro
    environment:
      LNBITS_USERNAME: localadmin
      LNBITS_PASSWORD: local-lnbits-password
      LNBITS_WALLET_ID: ''
    depends_on:
      lnbits-init:
        condition: service_completed_successfully

  hub:
    environment:
      OIDC_SERVER_METADATA_URL: http://keycloak:8080/realms/leprechaun/.well-known/openid-configuration
      OIDC_ISSUER: http://localhost:${KEYCLOAK_PORT:-8080}/realms/leprechaun
      OIDC_INTERNAL_BASE_URL: ''
      OIDC_CLIENT_ID: leprechaun-hub
      OIDC_CLIENT_SECRET: ''
    depends_on:
      keycloak:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  local_pgdata:
  local_lnbitsdata:
  local_config:
  local_keycloakdata:
